[package]
name = "reuse-evidence"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Evidence-gated reuse decisions for repository portfolios"
license = "MIT"
repository = "https://github.com/joeloverbeck/reuse-evidence"
readme = "README.md"
include = [
    "/src/**/*",
    "/tests/**/*",
    "/.claude/skills/reuse-evidence-*/**/*",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:skill-evidence"]

[dependencies]
clap = { version = "4.5.47", features = ["derive"], optional = true }
serde = { version = "1.0.219", features = ["derive"] }
skill-evidence = { version = "0.12.0", optional = true }
toml = "0.9.5"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "reuse-evidence"
path = "src/main.rs"
required-features = ["cli"]

# The command-line integration tests invoke the built binary through
# `CARGO_BIN_EXE_reuse-evidence`. Without the feature gate they would resolve a
# stale binary from an earlier default-feature build and report a false pass.
[[test]]
name = "case_cli"
path = "tests/case_cli.rs"
required-features = ["cli"]

[[test]]
name = "enroll_cli"
path = "tests/enroll_cli.rs"
required-features = ["cli"]

[[test]]
name = "portfolio_cli"
path = "tests/portfolio_cli.rs"
required-features = ["cli"]

[[test]]
name = "skills_cli"
path = "tests/skills_cli.rs"
required-features = ["cli"]

[[test]]
name = "terminal_contract_cli"
path = "tests/terminal_contract_cli.rs"
required-features = ["cli"]

# In-process coverage that reaches `case` and `portfolio`, which are public
# modules only under the `cli` feature.
[[test]]
name = "portfolio_location_library"
path = "tests/portfolio_location_library.rs"
required-features = ["cli"]

[[test]]
name = "case_library"
path = "tests/case_library.rs"
required-features = ["cli"]

[[test]]
name = "case_portfolio_library"
path = "tests/case_portfolio_library.rs"
required-features = ["cli"]

[[test]]
name = "portfolio_report_library"
path = "tests/portfolio_report_library.rs"
required-features = ["cli"]

[[test]]
name = "prepared_proposal_staging_library"
path = "tests/prepared_proposal_staging_library.rs"
required-features = ["cli"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
