[package]
name = "reuse-evidence"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Evidence-gated reuse decisions for repository portfolios"
license = "MIT"
repository = "https://github.com/joeloverbeck/reuse-evidence"
readme = "README.md"

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.5.47", features = ["derive"], optional = true }
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.9.5"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "reuse-evidence"
path = "src/main.rs"
required-features = ["cli"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
